<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nexus Admin · Sign In</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'nx-bg': '#f4f6fb',
          'nx-surface': '#ffffff',
          'nx-surface-2': '#f3f5fb',
          'nx-border': '#e3e8f5',
          'nx-cyan': '#06b6d4',
          'nx-violet': '#6366f1',
          'nx-pink': '#ec4899',
          'nx-text': '#1e2a3b',
          'nx-muted': '#94a1b8',
        },
        fontFamily: {
          display: ['Space Grotesk', 'sans-serif'],
          body: ['Inter', 'sans-serif'],
        },
      },
    },
  };
</script>

<style>
  @property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }

  body {
    background-color: #f4f6fb;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(6, 182, 212, 0.10), transparent 35%),
      radial-gradient(circle at 85% 75%, rgba(99, 102, 241, 0.10), transparent 40%),
      linear-gradient(rgba(15,23,42,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(15,23,42,0.025) 1px, transparent 1px);
    background-size: auto, auto, 42px 42px, 42px 42px;
  }

  /* Animated glowing border ring */
  .glow-frame {
    position: relative;
    border-radius: 22px;
    padding: 1.5px;
  }
  .glow-frame::before {
    content: '';
    position: absolute;
    inset: -1.5px;
    border-radius: 22px;
    background: conic-gradient(from var(--angle), #06b6d4, #6366f1, #ec4899, #06b6d4);
    animation: spin 6s linear infinite;
    z-index: 0;
  }
  .glow-frame::after {
    content: '';
    position: absolute;
    inset: -10px;
    border-radius: 28px;
    background: conic-gradient(from var(--angle), #06b6d4, #6366f1, #ec4899, #06b6d4);
    filter: blur(30px);
    opacity: 0.35;
    animation: spin 6s linear infinite;
    z-index: -1;
  }
  @keyframes spin {
    to { --angle: 360deg; }
  }

  .card-inner {
    position: relative;
    z-index: 1;
    border-radius: 21px;
    background: #ffffff;
    box-shadow: 0 20px 60px -15px rgba(30, 41, 59, 0.12);
  }

  /* Input focus glow */
  .nx-input {
    transition: box-shadow 0.25s ease, border-color 0.25s ease, background-color 0.25s ease;
  }
  .nx-input:focus {
    border-color: #06b6d4;
    box-shadow: 0 0 0 1px rgba(6, 182, 212, 0.25), 0 0 16px rgba(6, 182, 212, 0.18);
    background-color: #ffffff;
  }

  /* Primary button glow */
  .nx-btn {
    transition: transform 0.15s ease, box-shadow 0.25s ease, filter 0.25s ease;
    box-shadow: 0 8px 24px -4px rgba(99, 102, 241, 0.35), 0 0 0 1px rgba(99, 102, 241, 0.1);
  }
  .nx-btn:hover {
    box-shadow: 0 10px 30px -4px rgba(6, 182, 212, 0.4), 0 0 0 1px rgba(6, 182, 212, 0.15);
    filter: brightness(1.03);
  }
  .nx-btn:active {
    transform: scale(0.985);
  }

  .nx-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    box-shadow: none;
  }

  /* Logo pulse */
  .logo-glow {
    filter: drop-shadow(0 0 8px rgba(6, 182, 212, 0.35));
  }

  /* Shake animation for validation errors */
  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }
  .shake {
    animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
  }

  .field-error {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.2s ease;
  }
  .field-error.show {
    max-height: 2rem;
  }

  /* Spinner */
  .spinner {
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #ffffff;
    border-radius: 50%;
    width: 16px;
    height: 16px;
    animation: spin-loader 0.6s linear infinite;
  }
  @keyframes spin-loader {
    to { transform: rotate(360deg); }
  }

  /* Toast */
  .toast {
    transform: translateY(120%);
    opacity: 0;
    transition: transform 0.35s ease, opacity 0.35s ease;
  }
  .toast.show {
    transform: translateY(0);
    opacity: 1;
  }
</style>
</head>
<body class="min-h-screen flex items-center justify-center font-body text-nx-text px-4 py-10">

  <div class="w-full max-w-md">

    <!-- Brand -->
    <div class="flex items-center justify-center gap-3 mb-8">
      <svg class="logo-glow w-9 h-9" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M24 2L44 13V35L24 46L4 35V13L24 2Z" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round"/>
        <path d="M24 2V24L4 13" stroke="#818cf8" stroke-width="2" stroke-linejoin="round"/>
        <path d="M24 24L44 13" stroke="#f472b6" stroke-width="2" stroke-linejoin="round"/>
        <path d="M24 24V46" stroke="#818cf8" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="24" cy="24" r="3" fill="#22d3ee"/>
      </svg>
      <span class="font-display text-2xl font-700 tracking-wide">NEXUS <span class="text-nx-muted font-500">ADMIN</span></span>
    </div>

    <!-- Glowing card -->
    <div class="glow-frame">
      <div class="card-inner border border-nx-border px-7 sm:px-9 py-9 sm:py-10">

        <h1 class="font-display text-2xl font-700 text-center mb-1">Welcome back</h1>
        <p class="text-sm text-nx-muted text-center mb-8">Sign in to access the control center</p>

        <form id="loginForm" novalidate class="space-y-5">

          <!-- Email -->
          <div>
            <label for="email" class="block text-xs font-600 text-nx-muted mb-1.5 tracking-wide uppercase">Email address</label>
            <div class="relative">
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-nx-muted">
                <svg class="w-4.5 h-4.5" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" stroke="none"/><path d="M3 7l9 6 9-6"/><path d="M3 7v10a1 1 0 001 1h16a1 1 0 001-1V7a1 1 0 00-1-1H4a1 1 0 00-1 1z"/></svg>
              </span>
              <input type="email" id="email" name="email" autocomplete="email" placeholder="you@nexus.io"
                class="nx-input w-full bg-nx-surface-2 border border-nx-border rounded-xl pl-10 pr-4 py-3 text-sm placeholder:text-nx-muted/60 outline-none" />
            </div>
            <p class="field-error text-xs text-rose-400 mt-1.5" data-error-for="email">Enter a valid email address.</p>
          </div>

          <!-- Password -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label for="password" class="block text-xs font-600 text-nx-muted tracking-wide uppercase">Password</label>
              <a href="#" class="text-xs text-nx-cyan hover:text-nx-violet transition-colors">Forgot password?</a>
            </div>
            <div class="relative">
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-nx-muted">
                <svg class="w-4.5 h-4.5" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
              </span>
              <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••"
                class="nx-input w-full bg-nx-surface-2 border border-nx-border rounded-xl pl-10 pr-11 py-3 text-sm placeholder:text-nx-muted/60 outline-none" />
              <button type="button" id="togglePassword" aria-label="Show password" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-nx-muted hover:text-nx-cyan transition-colors">
                <svg id="eyeIcon" class="w-4.5 h-4.5" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <p class="field-error text-xs text-rose-400 mt-1.5" data-error-for="password">Password is required.</p>
          </div>

          <!-- Remember me -->
          <div class="flex items-center justify-between pt-1">
            <label for="remember" class="flex items-center gap-2.5 cursor-pointer select-none group">
              <input type="checkbox" id="remember" name="remember" class="peer sr-only">
              <span class="w-4.5 h-4.5 rounded border border-nx-border bg-nx-surface-2 flex items-center justify-center peer-checked:bg-nx-cyan peer-checked:border-nx-cyan transition-colors">
                <svg class="w-3 h-3 text-white opacity-0 peer-checked:opacity-100 transition-opacity" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
              </span>
              <span class="text-sm text-nx-muted group-hover:text-nx-text transition-colors">Remember me</span>
            </label>
          </div>

          <!-- Submit -->
          <button type="submit" id="loginBtn"
            class="nx-btn w-full bg-gradient-to-r from-nx-cyan via-nx-violet to-nx-pink text-white font-display font-700 text-sm rounded-xl py-3 mt-2 flex items-center justify-center gap-2">
            <span id="loginBtnText">Sign In</span>
          </button>

        </form>

        <div class="flex items-center gap-3 my-7">
          <span class="h-px flex-1 bg-nx-border"></span>
          <span class="text-xs text-nx-muted uppercase tracking-widest">or</span>
          <span class="h-px flex-1 bg-nx-border"></span>
        </div>

        <p class="text-center text-sm text-nx-muted">
          Don't have an account?
          <a href="register.html" class="text-nx-cyan hover:text-nx-violet font-600 transition-colors">Create one</a>
        </p>

      </div>
    </div>

    <p class="text-center text-xs text-nx-muted/60 mt-6">© 2026 Nexus Systems · Secured access portal</p>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast fixed bottom-6 left-1/2 -translate-x-1/2 bg-nx-surface border border-nx-border text-sm text-nx-text px-5 py-3 rounded-xl shadow-2xl flex items-center gap-2.5 z-50">
    <svg class="w-4.5 h-4.5 text-nx-cyan" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg>
    <span id="toastMsg">Signed in successfully</span>
  </div>

<script>
  const form = document.getElementById('loginForm');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const toggleBtn = document.getElementById('togglePassword');
  const eyeIcon = document.getElementById('eyeIcon');
  const loginBtn = document.getElementById('loginBtn');
  const loginBtnText = document.getElementById('loginBtnText');
  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toastMsg');

  // Toggle password visibility
  toggleBtn.addEventListener('click', () => {
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    toggleBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
    eyeIcon.innerHTML = isPassword
      ? '<path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a18.5 18.5 0 014.22-5.06M9.9 4.24A10.94 10.94 0 0112 4c7 0 11 7 11 7a18.5 18.5 0 01-2.16 2.94M14.12 14.12a3 3 0 11-4.24-4.24"/><path d="M1 1l22 22"/>'
      : '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
  });

  function showError(input, show) {
    const err = document.querySelector(`[data-error-for="${input.id}"]`);
    if (!err) return;
    err.classList.toggle('show', show);
    input.classList.toggle('border-rose-500/70', show);
  }

  function isValidEmail(value) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
  }

  function showToast(message, isError = false) {
    toastMsg.textContent = message;
    toast.classList.toggle('border-rose-500/40', isError);
    toast.classList.toggle('border-nx-border', !isError);
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();

    const emailValid = isValidEmail(emailInput.value.trim());
    const passwordValid = passwordInput.value.trim().length > 0;

    showError(emailInput, !emailValid);
    showError(passwordInput, !passwordValid);

    if (!emailValid || !passwordValid) {
      form.closest('.glow-frame').classList.add('shake');
      setTimeout(() => form.closest('.glow-frame').classList.remove('shake'), 500);
      return;
    }

    // Simulate authentication request
    loginBtn.disabled = true;
    loginBtnText.innerHTML = '<span class="spinner"></span>';

    setTimeout(() => {
      loginBtn.disabled = false;
      loginBtnText.textContent = 'Sign In';
      showToast('Signed in successfully — redirecting…');
      form.reset();
    }, 1400);
  });

  // Clear error state as user types
  [emailInput, passwordInput].forEach(input => {
    input.addEventListener('input', () => showError(input, false));
  });
</script>

</body>
</html>
